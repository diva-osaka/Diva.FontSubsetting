name: Build and Release

# PR: ビルドとパッケージ作成のみ
# master へのマージ: csproj の Version のタグ（v{Version}）が未作成なら GitHub Packages へ公開し、タグと Release を作成する

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  PROJECT: Diva.FontSubsetting/Diva.FontSubsetting.csproj
  PACKAGE_SOURCE: https://nuget.pkg.github.com/diva-osaka/index.json

jobs:
  build:
    # IKVM のビルドは開発環境と同じ Windows で行う
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(dotnet msbuild "$PROJECT" -getProperty:Version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION はリリース済みのため公開をスキップします"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        shell: bash
        run: dotnet pack "$PROJECT" -c Release -o ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.version.outputs.released == 'false'
        shell: bash
        run: dotnet nuget push "./artifacts/*.nupkg" --source "$PACKAGE_SOURCE" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Create release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.version.outputs.released == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" ./artifacts/*.nupkg --target "$GITHUB_SHA" --generate-notes
